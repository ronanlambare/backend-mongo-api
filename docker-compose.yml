services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    volumes:
      - ${MONGO_DATA_PATH:-mongo_data}:/data/db
    networks:
      - backend

  api:
    image: ${API_IMAGE:-ghcr.io/ronanlambare/backend-mongo-api:latest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGODB_DB:-mydb}?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-mydb}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: "${API_PORT:-8080}"
    depends_on:
      - mongo
    networks:
      - backend

