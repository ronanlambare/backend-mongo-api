version: "3.9"

# Usage sur le ZimaBoard :
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

services:
  mongo:
    image: mongo:7.0
    container_name: lambare-mongo
    restart: always
    ports:
      - "127.0.0.1:27017:27017"   # Uniquement loopback – pas exposé sur le réseau local
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - /opt/lambare/mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - lambare-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG:-latest}
    container_name: lambare-api
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"     # Uniquement loopback – le tunnel Cloudflare s'en charge
    environment:
      API_PORT: "8080"
      GIN_MODE: release
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
    networks:
      - lambare-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ── Cloudflare Tunnel ────────────────────────────────────────────────────────
  # Si vous préférez gérer le tunnel via Docker plutôt que le daemon système
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lambare-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - lambare-net
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongo_data:
    driver: local

networks:
  lambare-net:
    driver: bridge
